name: Deploy app

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "app/**"
      - "scripts/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:
    inputs:
      semantic_version:
        description: Optional semantic image tag, for example 1.0.0
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  STACK_NAME: ${{ vars.STACK_NAME || 'milk-ecs-webapp' }}
  SEMANTIC_VERSION_INPUT: ${{ github.event.inputs.semantic_version || '' }}

jobs:
  deploy-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get stack outputs
        id: stack
        run: |
          bash scripts/get-stack-outputs.sh

      - name: Sync static assets to S3
        run: |
          aws s3 sync ./app/assets "s3://${{ steps.stack.outputs.static_assets_bucket }}/assets" --delete

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image metadata
        id: image
        env:
          REPOSITORY_URI: ${{ steps.stack.outputs.repository_uri }}
        run: |
          bash scripts/resolve-image-metadata.sh

      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION="${{ steps.image.outputs.app_version }}" \
            --build-arg IMAGE_TAG="${{ steps.image.outputs.sha_tag }}" \
            -t "${{ steps.image.outputs.image_uri }}" \
            ./app

      - name: Tag semantic image
        if: steps.image.outputs.semver_tag != ''
        run: |
          docker tag \
            "${{ steps.image.outputs.image_uri }}" \
            "${{ steps.stack.outputs.repository_uri }}:${{ steps.image.outputs.semver_tag }}"

      - name: Push immutable image
        run: |
          docker push "${{ steps.image.outputs.image_uri }}"

      - name: Push semantic image
        if: steps.image.outputs.semver_tag != ''
        run: |
          docker push "${{ steps.stack.outputs.repository_uri }}:${{ steps.image.outputs.semver_tag }}"

      - name: Deploy app image
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.image_uri }}
        run: |
          bash scripts/deploy-cloudformation.sh

      - name: Summarize image tags
        run: |
          {
            echo "### Deployed image"
            echo ""
            echo "- Immutable tag: \`${{ steps.image.outputs.sha_tag }}\`"
            echo "- App version: \`${{ steps.image.outputs.app_version }}\`"
            echo "- Image URI: \`${{ steps.image.outputs.image_uri }}\`"
            if [ -n "${{ steps.image.outputs.semver_tag }}" ]; then
              echo "- Semantic tag: \`${{ steps.image.outputs.semver_tag }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
