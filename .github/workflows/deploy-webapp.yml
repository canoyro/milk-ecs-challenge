name: Deploy web app

on:
  push:
    branches:
      - main
    paths:
      - "CF-template/**"
      - ".github/workflows/deploy-webapp.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  STACK_NAME: ${{ vars.STACK_NAME || 'milk-ecs-webapp' }}
  TEMPLATE_DIR: CF-template

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy infrastructure
        working-directory: ${{ env.TEMPLATE_DIR }}
        run: |
          parameter_overrides=$(jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"' parameters.json)

          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file ecs-webapp.yaml \
            --parameter-overrides $parameter_overrides \
            --capabilities CAPABILITY_NAMED_IAM

      - name: Get ECR repository URI
        id: ecr
        run: |
          repository_uri=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ECRRepositoryUri'].OutputValue" \
            --output text)

          echo "repository_uri=$repository_uri" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push app image
        working-directory: ${{ env.TEMPLATE_DIR }}
        run: |
          image_tag="${GITHUB_SHA::12}"
          image_uri="${{ steps.ecr.outputs.repository_uri }}:$image_tag"

          docker build -t "$image_uri" ./app
          docker push "$image_uri"

          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Deploy app image
        working-directory: ${{ env.TEMPLATE_DIR }}
        run: |
          parameter_overrides=$(jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"' parameters.json)

          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file ecs-webapp.yaml \
            --parameter-overrides $parameter_overrides ContainerImage="$IMAGE_URI" \
            --capabilities CAPABILITY_NAMED_IAM
