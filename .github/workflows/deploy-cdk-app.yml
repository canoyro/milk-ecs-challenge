name: Deploy CDK app

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "app/**"
      - "scripts/get-stack-outputs.sh"
      - "scripts/resolve-image-metadata.sh"
      - "cdk/scripts/deploy-cdk.sh"
      - ".github/workflows/deploy-cdk-app.yml"
  workflow_dispatch:
    inputs:
      semantic_version:
        description: Optional semantic image tag, for example 1.0.0
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  STACK_NAME: ${{ vars.CDK_STACK_NAME || 'milk-ecs-webapp-cdk' }}
  CDK_STACK_NAME: ${{ vars.CDK_STACK_NAME || 'milk-ecs-webapp-cdk' }}
  CDK_VPC_ID: ${{ vars.CDK_VPC_ID || 'vpc-04571bb185086fe7f' }}
  CDK_PUBLIC_SUBNET_IDS: ${{ vars.CDK_PUBLIC_SUBNET_IDS || 'subnet-0f3b2f2ec01dcdc0e,subnet-070016a5fa27ca914' }}
  CDK_SECURITY_GROUP_ID: ${{ vars.CDK_SECURITY_GROUP_ID || 'sg-00778e9ef90895626' }}
  CDK_INSTANCE_TYPE: ${{ vars.CDK_INSTANCE_TYPE || 't3.micro' }}
  SEMANTIC_VERSION_INPUT: ${{ github.event.inputs.semantic_version || '' }}

jobs:
  deploy-cdk-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CDK_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm CDK deployment role
        run: |
          caller_arn=$(aws sts get-caller-identity --query Arn --output text)
          echo "Caller ARN: $caller_arn"

          if [[ "$caller_arn" != *":assumed-role/github-actions-milk-ecs-cdk/"* ]]; then
            echo "Expected CDK role github-actions-milk-ecs-cdk, got: $caller_arn" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Install CDK dependencies
        working-directory: cdk
        run: npm ci

      - name: Build CDK app
        working-directory: cdk
        run: npm run build

      - name: Check CDK bootstrap
        run: |
          aws ssm get-parameter --name /cdk-bootstrap/hnb659fds/version >/dev/null

      - name: Get CDK stack outputs
        id: stack
        run: |
          bash scripts/get-stack-outputs.sh

      - name: Sync static assets to S3
        run: |
          aws s3 sync ./app/assets "s3://${{ steps.stack.outputs.static_assets_bucket }}/assets" --delete

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image metadata
        id: image
        env:
          REPOSITORY_URI: ${{ steps.stack.outputs.repository_uri }}
        run: |
          bash scripts/resolve-image-metadata.sh

      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION="${{ steps.image.outputs.app_version }}" \
            --build-arg IMAGE_TAG="${{ steps.image.outputs.sha_tag }}" \
            -t "${{ steps.image.outputs.image_uri }}" \
            ./app

      - name: Tag semantic image
        if: steps.image.outputs.semver_tag != ''
        run: |
          docker tag \
            "${{ steps.image.outputs.image_uri }}" \
            "${{ steps.stack.outputs.repository_uri }}:${{ steps.image.outputs.semver_tag }}"

      - name: Push immutable image
        run: |
          docker push "${{ steps.image.outputs.image_uri }}"

      - name: Push semantic image
        if: steps.image.outputs.semver_tag != ''
        run: |
          docker push "${{ steps.stack.outputs.repository_uri }}:${{ steps.image.outputs.semver_tag }}"

      - name: Deploy app image with CDK
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.image_uri }}
        run: |
          bash cdk/scripts/deploy-cdk.sh

      - name: Summarize image tags
        run: |
          {
            echo "### Deployed CDK image"
            echo ""
            echo "- Stack: \`$CDK_STACK_NAME\`"
            echo "- Immutable tag: \`${{ steps.image.outputs.sha_tag }}\`"
            echo "- App version: \`${{ steps.image.outputs.app_version }}\`"
            echo "- Image URI: \`${{ steps.image.outputs.image_uri }}\`"
            if [ -n "${{ steps.image.outputs.semver_tag }}" ]; then
              echo "- Semantic tag: \`${{ steps.image.outputs.semver_tag }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
